<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartful Robots LLC</title>
<meta name="description" content="Heartful Robots LLC makes friendly, carefully designed software. Our first product is Addalaf, a humour assistant for public speakers.">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #fbfaf7;
    color: #1f1f1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 24px 48px;
  }
  h1 {
    font-size: 2rem;
    line-height: 1.2;
    font-weight: 650;
    margin: 0 0 32px;
    letter-spacing: -0.01em;
  }
  p { margin: 0 0 20px; }
  .contact { margin-top: 40px; }
  a { color: #1a4f8b; text-underline-offset: 3px; }
  a:hover { color: #0f3563; }
  footer {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 24px 40px;
    font-size: 0.875rem;
    color: #5a5a5a;
    border-top: 1px solid #e6e3dc;
  }
  @media (min-width: 768px) {
    main { padding-top: 120px; }
    h1 { font-size: 2.5rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Heartful Robots LLC</h1>
  <p>We make friendly, carefully designed software.</p>
  <p>Our first product is Addalaf, a humour assistant for public speakers.</p>
  <p>Heartful Robots LLC is a Delaware limited liability company.</p>
  <p class="contact">Contact: <a href="mailto:contact@heartfulrobots.com">contact@heartfulrobots.com</a></p>
</main>
<footer>© 2026 Heartful Robots LLC</footer>
</body>
</html>
